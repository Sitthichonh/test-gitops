apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web
spec:
  replicas: 5
  selector:
    matchLabels:
      app: my-web
  template:
    metadata:
      labels:
        app: my-web
    spec:
      containers:
        - name: my-web
          image: nginx:latest
          ports:
            - containerPort: 80
